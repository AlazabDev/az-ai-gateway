name: Validate Alazab Plugin

on:
  push:
    paths:
      - 'plugins/alazab-operations/**'
      - '.agents/plugins/marketplace.json'
      - 'ops/bind-openai-plugin-app.sh'
      - 'ops/audit-current-mcp.sh'
      - 'src/App.tsx'
      - 'src/pages/Auth.tsx'
      - 'src/pages/OAuthConsent.tsx'
      - 'src/pages/tools/SmartReports.tsx'
      - 'supabase/snippets/alazab_mcp_oauth_audience_hook.sql'
      - '.github/workflows/validate-alazab-plugin.yml'
  pull_request:
    paths:
      - 'plugins/alazab-operations/**'
      - '.agents/plugins/marketplace.json'
      - 'ops/bind-openai-plugin-app.sh'
      - 'ops/audit-current-mcp.sh'
      - 'src/App.tsx'
      - 'src/pages/Auth.tsx'
      - 'src/pages/OAuthConsent.tsx'
      - 'src/pages/tools/SmartReports.tsx'
      - 'supabase/snippets/alazab_mcp_oauth_audience_hook.sql'
      - '.github/workflows/validate-alazab-plugin.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alazab-plugin-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Plugin, OAuth and build validation
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.27.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Validate plugin JSON
        run: |
          node -e "JSON.parse(require('fs').readFileSync('plugins/alazab-operations/.codex-plugin/plugin.json','utf8')); JSON.parse(require('fs').readFileSync('.agents/plugins/marketplace.json','utf8'));"

      - name: Validate plugin structure
        run: |
          test -f plugins/alazab-operations/.codex-plugin/plugin.json
          test -f plugins/alazab-operations/skills/maintenance-operations/SKILL.md
          test -f plugins/alazab-operations/skills/daftra-read-operations/SKILL.md
          grep -q '^name: maintenance-operations$' plugins/alazab-operations/skills/maintenance-operations/SKILL.md
          grep -q '^name: daftra-read-operations$' plugins/alazab-operations/skills/daftra-read-operations/SKILL.md

      - name: Validate operational scripts
        run: |
          bash -n ops/bind-openai-plugin-app.sh
          bash -n ops/audit-current-mcp.sh

      - name: TypeScript
        run: pnpm run type-check

      - name: Scoped ESLint
        run: pnpm exec eslint src/App.tsx src/pages/Auth.tsx src/pages/OAuthConsent.tsx src/pages/tools/SmartReports.tsx

      - name: Unit tests
        run: pnpm run test:run

      - name: Production build
        run: pnpm run build
