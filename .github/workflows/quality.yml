name: Quality Gate

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: TypeScript, lint, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.27.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare logs
        run: mkdir -p quality-logs

      - name: TypeScript
        id: typescript
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          pnpm run type-check 2>&1 | tee quality-logs/typescript.log

      - name: ESLint
        id: eslint
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          pnpm run lint 2>&1 | tee quality-logs/eslint.log

      - name: Unit tests
        id: tests
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          pnpm run test:run 2>&1 | tee quality-logs/tests.log

      - name: Production build
        id: build
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          pnpm run build 2>&1 | tee quality-logs/build.log

      - name: Upload quality logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-logs
          path: quality-logs
          if-no-files-found: error
          retention-days: 7

      - name: Enforce quality gate
        if: ${{ steps.typescript.outcome == 'failure' || steps.eslint.outcome == 'failure' || steps.tests.outcome == 'failure' || steps.build.outcome == 'failure' }}
        run: exit 1
